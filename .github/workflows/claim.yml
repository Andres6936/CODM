name: CODM Daily Claim

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC (~12:00 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Claim
        id: claim
        shell: pwsh
        env:
          USERNAME: ${{ secrets.CODM_USERNAME }}
          COUNTRY: ${{ secrets.CODM_COUNTRY }}
          REGION: ${{ secrets.CODM_REGION }}
        run: |
          $ErrorActionPreference = 'Continue'

          # Build argument list
          $args = @('--json')

          if ($env:REGION -and $env:REGION -ne 'auto') {
            $args += '--region', $env:REGION
          }
          if ($env:COUNTRY -and $env:COUNTRY -ne 'auto') {
            $args += '--country', $env:COUNTRY
          }

          # Prepare output directory and filename
          New-Item -ItemType Directory -Force -Path 'output' | Out-Null
          $ts      = Get-Date -Format 'yyyy-MM-dd'
          $jsonOut = "output/claim-$ts.json"
          $logOut  = "output/claim-$ts.log"

          # Run the claim, capturing stdout and stderr separately
          bun run index $env:USERNAME @args 1> $jsonOut 2> $logOut
          $rc = $LASTEXITCODE

          # Publish exit code as output
          "claim_exit_code=$rc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # Fail the step if exit code is 3 (server error)
          if ($rc -eq 3) { exit 1 }

      - name: Commit output
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $date = Get-Date -Format 'yyyy-MM-dd'
            git commit -m "chore(codm): claim results $date"
            git push
          } else {
            Write-Host "No changes to commit."
          }
